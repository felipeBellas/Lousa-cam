/* =====================================================
   ETAPA 10F
   EDITOR DE TEXTO — LIMITE RESPONSIVO

   Impede que a caixa de texto ultrapasse
   horizontalmente a área visível do aparelho.

   IMPORTANTE:
   - não altera câmera
   - não altera canvas
   - não altera barra superior
   - não altera ferramentas Aa
   ===================================================== */

#inlineEditor {

  position: fixed;

  display: none;

  z-index: 80;

  margin: 0;

  padding:
    4px 7px;

  border:
    2px dotted
    rgba(255, 255, 255, 0.95);

  border-radius: 4px;

  background:
    rgba(0, 0, 0, 0.18);

  color: #fff;

  outline: none;

  /*
    Mantemos o redimensionamento
    manual já existente.
  */
  resize: both;

  /*
    O conteúdo permanece dentro
    da própria caixa.
  */
  overflow: auto;

  /*
    Permite quebra normal de linha.
  */
  white-space: pre-wrap;

  overflow-wrap: anywhere;

  word-wrap: break-word;

  word-break: break-word;

  /*
    Proteção geral contra crescimento
    além da largura física da tela.

    O limite exato considerando a posição X
    também será calculado pelo app.js.
  */
  max-width:
    calc(100vw - 16px);

  max-width:
    calc(100dvw - 16px);

  min-width: 60px;

  min-height: 30px;

  /*
    Muito importante em elementos editáveis:
    impede que o conteúdo force uma largura
    mínima maior que a viewport.
  */
  min-inline-size: 0;

  user-select: text;

  -webkit-user-select: text;

  -webkit-touch-callout: default;

  touch-action: auto;

  pointer-events: auto;

}

    #inlineEditor.show {

      display: block;

    }

     CAMERA MODULE — C3
     Carregamento passivo.
     Ainda NÃO controla a câmera do aplicativo.
     ===================================================== -->

<script src="./camera.js?v=20260928-01"></script>

<script src="./app.js?v=20261004-01"></script>

<script src="./pencil.js?v=20260924-02"></script>

<script src="./gallery.js?v=20261002-01"></script>

<script src="./teleprompter.js?v=20261010-02"></script>
  
<script>

(() => {

  "use strict";


  const modeDock =
    document.getElementById(
      "modeDock"
    );


  const cameraButton =
    document.getElementById(
      "cameraModeButton"
    );


  const galleryButton =
    document.getElementById(
      "galleryModeButton"
    );


  const teleprompterButton =
    document.getElementById(
      "teleprompterButton"
    );


  const galleryLayer =
    document.getElementById(
      "galleryLayer"
    );


  if (
    !modeDock ||
    !cameraButton ||
    !galleryButton ||
    !teleprompterButton ||
    !galleryLayer
  ) {

    console.warn(
      "Lousa Cam: navegação incompleta."
    );

    return;

  }


  let dockTimer = null;


  /* =====================================================
     DOCK
     ===================================================== */

  function activateDock() {

    modeDock.classList.add(
      "active"
    );


    clearTimeout(
      dockTimer
    );


    dockTimer =
      setTimeout(
        () => {

          modeDock.classList.remove(
            "active"
          );

        },
        2200
      );

  }


  /* =====================================================
     BOTÃO ATIVO
     ===================================================== */

  function setActiveButton(
    activeButton
  ) {

    const buttons = [

      cameraButton,

      galleryButton,

      teleprompterButton

    ];


    for (
      const button
      of buttons
    ) {

      const active =
        button === activeButton;


      button.classList.toggle(
        "active",
        active
      );


      button.setAttribute(
        "aria-pressed",
        active
          ? "true"
          : "false"
      );

    }

  }


  /* =====================================================
     CÂMERA
     ===================================================== */

  function showCamera() {

    galleryLayer.classList.remove(
      "show"
    );


    galleryLayer.setAttribute(
      "aria-hidden",
      "true"
    );


    if (
      window.LousaCamTeleprompter &&
      typeof
        window.LousaCamTeleprompter.close ===
        "function"
    ) {

      window.LousaCamTeleprompter.close();

    }


    setActiveButton(
      cameraButton
    );


    activateDock();

  }


  /* =====================================================
     GALERIA
     ===================================================== */

  function showGallery() {

    if (
      window.LousaCamTeleprompter &&
      typeof
        window.LousaCamTeleprompter.close ===
        "function"
    ) {

      window.LousaCamTeleprompter.close();

    }


    if (
      typeof window.loadGallery ===
      "function"
    ) {

      window.loadGallery();

    }


    galleryLayer.classList.add(
      "show"
    );


    galleryLayer.setAttribute(
      "aria-hidden",
      "false"
    );


    setActiveButton(
      galleryButton
    );


    activateDock();

  }


  /* =====================================================
     TELEPROMPTER
     ===================================================== */

  function showTeleprompter() {

    galleryLayer.classList.remove(
      "show"
    );


    galleryLayer.setAttribute(
      "aria-hidden",
      "true"
    );


    if (
      !window.LousaCamTeleprompter ||
      typeof
        window.LousaCamTeleprompter.open !==
        "function"
    ) {

      console.warn(
        "Teleprompter indisponível."
      );


      setActiveButton(
        cameraButton
      );


      activateDock();

      return;

    }


    window.LousaCamTeleprompter.open();


    setActiveButton(
      teleprompterButton
    );


    activateDock();

  }


  /* =====================================================
     EVENTOS
     ===================================================== */

  cameraButton.addEventListener(
    "click",
    showCamera
  );


  galleryButton.addEventListener(
    "click",
    showGallery
  );


  teleprompterButton.addEventListener(
    "click",
    showTeleprompter
  );


  modeDock.addEventListener(
    "pointerdown",
    activateDock
  );


  /*
    Quando o X interno fecha o Teleprompter,
    o dock volta para Câmera.
  */

  window.addEventListener(
    "lousacam:teleprompterchange",
    event => {

      if (
        !event.detail ||
        event.detail.open !== false
      ) {

        return;

      }


      setActiveButton(
        cameraButton
      );


      activateDock();

    }
  );


  /* =====================================================
     ESTADO INICIAL
     ===================================================== */

  showCamera();

})();

</script>
