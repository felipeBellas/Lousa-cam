<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lousa Cam</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
    }

    /* Tela de Início Obrigatória */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    #btn-start-app {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,122,255,0.4);
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }

    .top-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .action-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    #ai-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 500px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px;
      color: #fff;
      z-index: 20;
      display: none;
    }

    #ai-panel.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Overlay que força a permissão no clique -->
    <div id="start-overlay">
      <h2>Lousa Cam</h2>
      <p>Clique no botão abaixo para permitir a câmera e iniciar a lousa.</p>
      <button id="btn-start-app">Iniciar Câmera e Lousa</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="top-controls">
      <button class="action-btn" id="btn-clear">Limpar Tela</button>
      <button class="action-btn" id="btn-color">Mudar Cor</button>
      <button class="action-btn" id="btn-ai" style="background: #5856d6;">🧠 Analisar com IA</button>
    </div>

    <div id="ai-panel">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <strong>Resultado da IA:</strong>
        <button id="btn-close-ai" style="background: none; border: none; color: #fff; cursor: pointer;">✕</button>
      </div>
      <div id="ai-text">Aguardando...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
