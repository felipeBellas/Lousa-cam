<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<title>Lousa Cam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;touch-action:none}
body{user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
#top{position:absolute;z-index:20;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#left,#right{display:flex;align-items:center;gap:6px;min-width:0;pointer-events:auto}
button{border:0;outline:none;cursor:pointer;display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;border-radius:12px;background:rgba(20,20,20,.78);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.25);flex:0 0 46px}
button:active{transform:scale(.94)}
button svg{width:21px;height:21px;stroke:currentColor}
#textToolButton{font-family:Arial,sans-serif;font-size:21px;font-weight:700;line-height:1;position:absolute;left:162px;top:0;z-index:25}
#record{position:absolute;z-index:30;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:rgba(210,30,30,.95);border:4px solid rgba(255,255,255,.9)}
#record.recording{background:#fff}
#record.recording::after{content:"";width:22px;height:22px;border-radius:4px;background:#d71919}
#canvasMenu{position:fixed;z-index:100;display:none;min-width:150px;max-width:calc(100vw - 20px);padding:6px;background:rgba(25,25,25,.96);border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#canvasMenu.show{display:block}
#canvasMenu button{width:100%;height:44px;flex:none;justify-content:flex-start;padding:0 14px;background:transparent;border-radius:10px;font-size:16px;font-weight:500}
#canvasMenu button:hover{background:rgba(255,255,255,.12)}
#tools{position:absolute;z-index:40;top:calc(62px + env(safe-area-inset-top,0px));left:8px;display:none;padding:12px;border-radius:16px;background:rgba(20,20,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#tools.show{display:block}
#tools label{display:block;margin-bottom:8px;color:#fff;font-size:13px}
#tools input{width:150px}
#toolName{color:#fff;font-size:13px;margin-top:8px}
#menuPanel{position:absolute;z-index:41;top:calc(62px + env(safe-area-inset-top,0px));left:8px;display:none;padding:8px;border-radius:14px;background:rgba(20,20,20,.94);box-shadow:0 10px 35px rgba(0,0,0,.4)}
#menuPanel.show{display:block}
#menuPanel button{width:180px;height:42px;flex:none;justify-content:flex-start;padding:0 12px;background:transparent;font-size:15px}
#startOverlay{position:absolute;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.94)}
#startOverlay.hidden{display:none}
#startBox{width:min(420px,100%);padding:28px 22px;text-align:center;color:#fff;border-radius:22px;background:rgba(30,30,30,.96);box-shadow:0 15px 50px rgba(0,0,0,.45)}
#startBox h1{margin:0 0 10px;font-size:27px}
#startBox p{margin:0 0 22px;color:#ccc;font-size:15px;line-height:1.5}
#startBtn{width:100%;height:52px;flex:none;background:#fff;color:#111;font-size:16px;font-weight:700;border-radius:13px}
#status{margin-top:12px;min-height:18px;color:#aaa;font-size:12px}
@media(max-width:600px){
#top{left:5px;right:5px}#left,#right{gap:3px}
#left button,#right button{width:40px;height:40px;flex-basis:40px;border-radius:10px}
#left button svg,#right button svg{width:18px;height:18px}
#textToolButton{left:135px;width:40px;height:40px;flex-basis:40px;font-size:19px}
}
@media(max-width:390px){
#top{left:3px;right:3px}#left,#right{gap:2px}
#left button,#right button{width:37px;height:37px;flex-basis:37px;border-radius:9px}
#left button svg,#right button svg{width:17px;height:17px}
#textToolButton{left:125px;width:37px;height:37px;font-size:18px}
}
</style>
</head>
<body>
<div id="app">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="top">
<div id="left">
<button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<button id="undo" aria-label="Desfazer"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
<button id="redo" aria-label="Refazer"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg></button>
<button id="clear" aria-label="Limpar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
<button id="textToolButton" aria-label="Adicionar texto" title="Texto">T</button>
</div>
<div id="right">
<button id="flip" aria-label="Inverter câmera"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 7h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg></button>
<button id="settings" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20h-2.5v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6V11.5h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L9 6.7l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5h2.5v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1V14h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></div>
<div id="menuPanel"><button id="menuCloseTools">Fechar painel</button></div>
<div id="tools">
<label>Cor<br><input id="color" type="color" value="#ffffff"></label>
<label>Espessura<br><input id="width" type="range" min="1" max="40" value="5"></label>
<button id="eraser" aria-label="Borracha"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 20H8l-5-5 10-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-7 7"/><path d="M6 14l4 4"/></svg></button>
<div id="toolName">Caneta</div>
</div>
<div id="canvasMenu"><button data-action="paste">Colar</button></div>
<input id="imageInput" type="file" accept="image/*" hidden>
<button id="record" aria-label="Gravar"></button>
<div id="startOverlay"><div id="startBox"><h1>Lousa Cam</h1><p>Para começar, permita o acesso à câmera e ao microfone.</p><button id="startBtn">Iniciar câmera</button><div id="status"></div></div></div>
</div>
<script src="./app.js?v=20260910-02"></script>
</body>
</html>
