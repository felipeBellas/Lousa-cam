<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lousa Cam // IDE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-container">
    <video id="video" autoplay playsinline muted></video>

    <canvas id="canvas"></canvas>

    <button id="btn-toggle-menu" class="floating-btn menu-toggle" title="Terminal Menu">&lt;/&gt;</button>
    <button id="btn-toggle-pen" class="floating-btn pen-toggle" title="Tool Config">#</button>

    <div id="toolbarWrapper" class="toolbar-wrapper collapsed">
      <div class="toolbar">
        <span class="code-tag">&lt;actions&gt;</span>
        <button id="btn-undo" class="btn-icon" title="Undo [Ctrl+Z]">UNDO</button>
        <button id="btn-redo" class="btn-icon" title="Redo [Ctrl+Y]">REDO</button>
        <button id="btn-clear-all" class="btn-icon btn-danger" title="Clear Canvas">CLEAR</button>
        <button id="btn-flip" class="btn-icon" title="Flip Camera">CAM</button>
        <button id="btn-record" class="btn-icon btn-rec" title="Record Screen">
          REC
        </button>
        <span class="code-tag">&lt;/actions&gt;</span>
      </div>
    </div>

    <div id="penSideWrapper" class="pen-side-wrapper collapsed">
      <div class="pen-side-panel">
        <div class="panel-header">// DEV_TOOLS</div>

        <div class="config-group">
          <label class="label-title">VAR strokeWidth =</label>
          <input type="range" id="lineWidth" min="1" max="30" value="4" />
        </div>

        <div class="config-group">
          <label class="label-title">CONST color =</label>
          <div class="color-palette">
            <div class="color-dot active" data-color="#ffffff" style="background: #ffffff;" title="#FFFFFF"></div>
            <div class="color-dot" data-color="#00ff66" style="background: #00ff66;" title="#00FF66"></div>
            <div class="color-dot" data-color="#00e5ff" style="background: #00e5ff;" title="#00E5FF"></div>
            <div class="color-dot" data-color="#ff0055" style="background: #ff0055;" title="#FF0055"></div>
            <div class="color-dot" data-color="#ffb700" style="background: #ffb700;" title="#FFB700"></div>
            <div class="color-dot" data-color="#9d00ff" style="background: #9d00ff;" title="#9D00FF"></div>
            <div class="color-dot" data-color="#000000" style="background: #000000; border: 1px solid #00ff66;" title="#000000"></div>
            <div class="color-dot" data-color="#708090" style="background: #708090;" title="#708090"></div>
          </div>
        </div>

        <button id="btn-eraser" class="btn-eraser" title="Nullify/Erase">NULL (Eraser)</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
