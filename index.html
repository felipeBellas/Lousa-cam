<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#000000">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lousa Cam">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Lousa Cam 2.0</title>

  <style>
    :root {
      --glass: rgba(18,18,20,.68);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    #video,
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      background: #000;
    }

    #video.mirror {
      transform: scaleX(-1);
    }

    #canvas {
      z-index: 2;
      touch-action: none;
    }

    #ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .bar {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    #top {
      left: 12px;
      right: 12px;
      top: max(12px, env(safe-area-inset-top));
      justify-content: space-between;
    }

    #left,
    #right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #bottom {
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      justify-content: center;
    }

    button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.24);
      background: var(--glass);
      color: #fff;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      display: grid;
      place-items: center;

      font-size: 20px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.25);

      cursor: pointer;
      padding: 0;
    }

    button:active {
      transform: scale(.94);
    }

    button:disabled {
      opacity: .38;
    }

    #record {
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255,255,255,.8);
    }

    #record span {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #ff3b30;
    }

    #record.recording span {
      border-radius: 5px;
      background: #fff;
    }

    #status {
      position: absolute;

      left: 50%;
      top: max(
        62px,
        calc(env(safe-area-inset-top) + 50px)
      );

      transform: translateX(-50%);

      padding: 7px 12px;

      border-radius: 20px;

      background: rgba(0,0,0,.55);
      color: #fff;

      font-size: 12px;

      opacity: 0;

      transition: .2s;

      pointer-events: none;

      white-space: nowrap;
    }

    #status.show {
      opacity: 1;
    }

    .panel {
      position: absolute;

      top: 66px;
      right: 12px;

      padding: 12px;

      border-radius: 18px;

      background: rgba(15,15,17,.86);

      border:
        1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      display: none;

      pointer-events: auto;
    }

    .panel.open {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .colors {
      display: flex;
      gap: 10px;
    }

    .color {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      border: 2px solid transparent;
    }

    .color.active {
      border-color: #fff;
      transform: scale(1.12);
    }

    input[type=range] {
      width: 130px;
      accent-color: #fff;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;

      color: #fff;
      font-size: 12px;
    }

    #startOverlay {
      position: absolute;
      inset: 0;

      z-index: 30;

      display: grid;
      place-items: center;

      background: rgba(0,0,0,.86);

      color: #fff;

      padding: 24px;

      text-align: center;
    }

    #startOverlay.hidden {
      display: none;
    }

    #startCard {
      max-width: 420px;
    }

    #startCard h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    #startCard p {
      opacity: .78;
      line-height: 1.45;
      margin: 0 0 20px;
    }

    #startBtn {
      width: auto;
      height: 48px;

      border-radius: 24px;

      padding: 0 22px;

      font-size: 16px;
    }

    #permissionHint {
      margin-top: 12px;

      font-size: 12px;

      opacity: .65;
    }

    @media (orientation: portrait) {

      #startCard h1 {
        font-size: 24px;
      }

    }
  </style>
</head>

<body>

<div id="app">

  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="canvas"></canvas>

  <div id="ui">

    <div id="top" class="bar">

      <div id="left">

        <button
          id="menuBtn"
          aria-label="Menu"
          title="Menu">
          ☰
        </button>

        <button
          id="undo"
          aria-label="Desfazer"
          title="Desfazer">
          ↶
        </button>

        <button
          id="redo"
          aria-label="Refazer"
          title="Refazer">
          ↷
        </button>

        <button
          id="clear"
          aria-label="Limpar"
          title="Limpar">
          🗑
        </button>

      </div>

      <div id="right">

        <button
          id="flip"
          aria-label="Trocar câmera"
          title="Trocar câmera">
          🔄
        </button>

        <button
          id="settings"
          aria-label="Ferramentas"
          title="Ferramentas">
          ✎
        </button>

      </div>

    </div>


    <div
      id="menuPanel"
      class="panel"
      aria-hidden="true">

      <div class="row">
        <strong>Lousa Cam 2.0</strong>
      </div>

      <div class="row">
        <span>
          Desenhe diretamente sobre a imagem.
        </span>
      </div>

    </div>


    <div
      id="tools"
      class="panel"
      aria-hidden="true">

      <div class="colors">

        <button
          class="color active"
          style="background:#fff"
          data-color="#fff"
          aria-label="Branco">
        </button>

        <button
          class="color"
          style="background:#ff3b30"
          data-color="#ff3b30"
          aria-label="Vermelho">
        </button>

        <button
          class="color"
          style="background:#ffcc00"
          data-color="#ffcc00"
          aria-label="Amarelo">
        </button>

        <button
          class="color"
          style="background:#34c759"
          data-color="#34c759"
          aria-label="Verde">
        </button>

        <button
          class="color"
          style="background:#0a84ff"
          data-color="#0a84ff"
          aria-label="Azul">
        </button>

      </div>


      <div class="row">

        Espessura

        <input
          id="width"
          type="range"
          min="2"
          max="32"
          value="5">

      </div>


      <div class="row">

        <button
          id="eraser"
          aria-label="Borracha"
          title="Borracha"
          style="width:40px;height:40px">
          ⌫
        </button>

        <span id="toolName">
          Caneta
        </span>

      </div>

    </div>


    <div id="bottom" class="bar">

      <button
        id="record"
        aria-label="Gravar"
        title="Gravar">

        <span></span>

      </button>

    </div>


    <div id="status"></div>

  </div>


  <div id="startOverlay">

    <div id="startCard">

      <h1>
        LOUSA CAM 2.0
      </h1>

      <p>
        Ative a câmera e o microfone para usar
        a lousa sobre sua imagem.
        Para melhor resultado no iPhone,
        use o aparelho na horizontal.
      </p>

      <button id="startBtn">
        Ativar câmera e microfone
      </button>

      <div id="permissionHint">
        O Safari solicitará as permissões.
      </div>

    </div>

  </div>

</div>

<script src="./app.js"></script>

</body>
</html>
