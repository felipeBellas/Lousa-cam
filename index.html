<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#000000">

  <!-- iOS / Safari -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

  <meta
    name="apple-mobile-web-app-title"
    content="Lousa Cam">

  <!-- Ícones -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./logo.png">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./logo.png">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./logo.png">

  <link
    rel="apple-touch-icon"
    href="./logo.png">

  <link
    rel="manifest"
    href="./manifest.json">

  <title>Lousa Cam 2.0</title>


  <style>

    :root {

      --glass: rgba(22, 22, 26, 0.72);

      --border: rgba(255, 255, 255, 0.18);

    }


    * {

      box-sizing: border-box;

      user-select: none;

      -webkit-user-select: none;

      -webkit-touch-callout: none;

    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100vw;

      height: 100vh;

      overflow: hidden;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Roboto,
        sans-serif;

    }


    body {

      overscroll-behavior: none;

    }


    #app {

      position: fixed;

      inset: 0;

      background: #000;

      overflow: hidden;

    }


    #video,
    #canvas {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

    }


    #video {

      z-index: 1;

      object-fit: cover;

      background: #000;

    }


    #video.mirror {

      transform: scaleX(-1);

    }


    #canvas {

      z-index: 2;

      touch-action: none;

    }


    #ui {

      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

    }


    /* =====================================================
       BARRA ORIGINAL
       ===================================================== */

    .bar {

      position: absolute;

      display: flex;

      align-items: center;

      gap: 10px;

      pointer-events: auto;

    }


    #top {

      left:
        max(16px, env(safe-area-inset-left));

      right:
        max(16px, env(safe-area-inset-right));

      top:
        max(16px, env(safe-area-inset-top));

      justify-content:
        space-between;

    }


    #left,
    #right {

      display: flex;

      gap: 10px;

      align-items: center;

    }


    #bottom {

      left: 0;

      right: 0;

      bottom:
        max(20px, env(safe-area-inset-bottom));

      justify-content: center;

    }


    button {

      width: 48px;

      height: 48px;

      border-radius: 50%;

      border:
        1px solid var(--border);

      background:
        var(--glass);

      color: #fff;

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35);

      cursor: pointer;

      padding: 0;

      transition:
        transform 0.15s ease,
        background-color 0.2s ease;

    }


    button svg {

      width: 22px;

      height: 22px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    button:active {

      transform: scale(0.92);

    }


    button:disabled {

      opacity: 0.35;

    }


    /* =====================================================
       T — ÚNICO BOTÃO NOVO
       Não modifica os botões originais.
       ===================================================== */

   #textToolButton {

  position: static;

  width: 40px;

  height: 40px;

  flex-shrink: 0;

  transform: none;

  z-index: auto;

  font-size: 20px;

  font-weight: 700;

  font-family: Arial, sans-serif;

  pointer-events: auto;

}


    #textToolButton:active {

  transform: scale(0.92);

}
    .text-menu-item {

  justify-content: flex-start;

  gap: 10px;

}


    /* =====================================================
       GRAVAÇÃO
       ===================================================== */

    #record {

      width: 64px;

      height: 64px;

      border:
        3px solid rgba(255, 255, 255, 0.85);

      background:
        rgba(0, 0, 0, 0.4);

    }


    #record span {

      width: 28px;

      height: 28px;

      border-radius: 50%;

      background: #ff3b30;

      transition:
        all 0.25s
        cubic-bezier(0.4, 0, 0.2, 1);

    }


    #record.recording span {

      border-radius: 6px;

      width: 22px;

      height: 22px;

      background: #fff;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      position: absolute;

      left: 50%;

      top:
        max(
          72px,
          calc(
            env(safe-area-inset-top)
            + 60px
          )
        );

      transform:
        translateX(-50%);

      padding:
        8px 16px;

      border-radius: 20px;

      background:
        rgba(18, 18, 20, 0.85);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      color: #fff;

      font-size: 13px;

      font-weight: 500;

      opacity: 0;

      transition:
        opacity 0.25s ease;

      pointer-events: none;

      white-space: nowrap;

      z-index: 100;

    }


    #status.show {

      opacity: 1;

    }


    /* =====================================================
       PAINÉIS ORIGINAIS
       ===================================================== */

    .panel {

      position: absolute;

        top:
    calc(
      max(16px, env(safe-area-inset-top))
      + 58px
    );

  left:
    max(16px, env(safe-area-inset-left));

      padding: 16px;
        width: max-content;

  max-width:
    calc(
      100vw - 32px
    );

      border-radius: 22px;

      background:
        rgba(22, 22, 26, 0.88);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(24px);

      -webkit-backdrop-filter:
        blur(24px);

      display: none;

      pointer-events: auto;

      box-shadow:
        0 12px 32px
        rgba(0, 0, 0, 0.4);

      z-index: 40;

    }


    .panel.open {

      display: flex;

      flex-direction: column;

      gap: 14px;

    }


    .colors {

      display: flex;

      gap: 10px;

    }


    .color {

      width: 32px;

      height: 32px;

      border-radius: 50%;

      border:
        2px solid transparent;

      cursor: pointer;

    }


    .color.active {

      border-color: #fff;

      transform: scale(1.12);

    }


    input[type=range] {

      width: 120px;

      accent-color: #fff;

    }


    .row {

      display: flex;

      align-items: center;

      gap: 10px;

      color: #fff;

      font-size: 13px;

    }


    /* =====================================================
       MENU COLAR
       ===================================================== */

    #canvasMenu {

      position: fixed;

      z-index: 70;

      display: none;

      pointer-events: auto;

    }


    #canvasMenu.open {

      display: block;

    }


    #pasteButton {

      width: auto;

      min-width: 82px;

      height: 42px;

      padding:
        0 18px;

      border-radius: 21px;

      font-size: 14px;

      font-weight: 600;

    }


    /* =====================================================
       EDITOR DE TEXTO
       ===================================================== */

    #inlineEditor {

      position: fixed;

      display: none;

      z-index: 80;

      margin: 0;

      padding:
        4px 7px;

      border:
        2px dotted
        rgba(255, 255, 255, 0.95);

      border-radius: 4px;

      background:
        rgba(0, 0, 0, 0.18);

      color: #fff;

      outline: none;

      resize: both;

      overflow: auto;

      white-space: pre-wrap;

      word-break: break-word;

      font-family:
        Arial,
        sans-serif;

      line-height: 1.15;

      min-width: 60px;

      min-height: 30px;

      user-select: text;

      -webkit-user-select: text;

      -webkit-touch-callout: default;

      touch-action: auto;

    }


    #inlineEditor.show {

      display: block;

    }


    /* =====================================================
       CANCELAR IMAGEM
       ===================================================== */

    #objectCancel {

      position: fixed;

      display: none;

      z-index: 75;

      width: auto;

      min-width: 84px;

      height: 40px;

      padding:
        0 16px;

      border-radius: 20px;

      background:
        rgba(22, 22, 26, 0.9);

      font-size: 13px;

      font-weight: 600;

    }


    #objectCancel.show {

      display: flex;

    }


    /* =====================================================
       TELA INICIAL
       ===================================================== */

    #startOverlay {

      position: fixed;

      inset: 0;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(0, 0, 0, 0.82);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      color: #fff;

      padding: 24px;

      text-align: center;

    }


    #startOverlay.hidden {

      display: none !important;

    }


    #startCard {

      max-width: 380px;

      width: 100%;

      padding:
        32px 24px;

      background:
        rgba(28, 28, 32, 0.75);

      border:
        1px solid var(--border);

      border-radius: 28px;

      box-shadow:
        0 20px 40px
        rgba(0, 0, 0, 0.5);

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .intro-logo {

      width: 96px;

      height: 96px;

      border-radius: 22px;

      margin-bottom: 16px;

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.4);

      object-fit: cover;

    }


    #startCard h1 {

      font-size: 24px;

      font-weight: 700;

      letter-spacing: 0.5px;

      margin:
        0 0 12px;

    }


    #startCard p {

      font-size: 14px;

      color:
        rgba(255, 255, 255, 0.75);

      line-height: 1.5;

      margin:
        0 0 24px;

    }


    #startBtn {

      width: 100%;

      height: 52px;

      border-radius: 26px;

      background: #007aff;

      border: none;

      font-size: 15px;

      font-weight: 600;

      color: #fff;

      box-shadow:
        0 4px 16px
        rgba(0, 122, 255, 0.35);

    }


    #startBtn:active {

      transform: scale(0.97);

    }


    #permissionHint {

      margin-top: 14px;

      font-size: 12px;

      color:
        rgba(255, 255, 255, 0.5);

    }


   

  </style>

</head>


<body>

<div id="app">


  <video
    id="video"
    autoplay
    playsinline
    muted>
  </video>


  <canvas id="canvas"></canvas>


  <div id="ui">


    <!-- =================================================
         BARRA SUPERIOR
         ================================================= -->

    <div
      id="top"
      class="bar">


      <div id="left">


        <button
          id="menuBtn"
          aria-label="Menu"
          title="Menu">

          <svg viewBox="0 0 24 24">

            <line
              x1="3"
              y1="12"
              x2="21"
              y2="12">
            </line>

            <line
              x1="3"
              y1="6"
              x2="21"
              y2="6">
            </line>

            <line
              x1="3"
              y1="18"
              x2="21"
              y2="18">
            </line>

          </svg>

        </button>


        <button
          id="undo"
          aria-label="Desfazer"
          title="Desfazer">

          <svg viewBox="0 0 24 24">

            <path
              d="M3 7v6h6">
            </path>

            <path
              d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13">
            </path>

          </svg>

        </button>


        <button
          id="redo"
          aria-label="Refazer"
          title="Refazer">

          <svg viewBox="0 0 24 24">

            <path
              d="M21 7v6h-6">
            </path>

            <path
              d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7">
            </path>

          </svg>

        </button>


        <button
          id="clear"
          aria-label="Limpar"
          title="Limpar">

          <svg viewBox="0 0 24 24">

            <polyline
              points="3 6 5 6 21 6">
            </polyline>

            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
            </path>

          </svg>

        </button>


      </div>


      
      <div id="right">


        <button
          id="flip"
          aria-label="Trocar câmera"
          title="Trocar câmera">

          <svg viewBox="0 0 24 24">

            <path
              d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v4">
            </path>

            <path
              d="M16 19l3 3 3-3">
            </path>

            <path
              d="M19 13v9">
            </path>

          </svg>

        </button>


        <button
          id="settings"
          aria-label="Ferramentas"
          title="Ferramentas">

          <svg viewBox="0 0 24 24">

            <path
              d="M12 20h9">
            </path>

            <path
              d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z">
            </path>

          </svg>

        </button>


      </div>


    </div>


    <!-- =================================================
         MENU
         ================================================= -->

    <div
  id="menuPanel"
  class="panel"
  aria-hidden="true">

  <div class="row">

    <strong>
      Menu
    </strong>

  </div>

  <div class="row">

    <span>
      
    </span>

  </div>

  <div class="row text-menu-item">

    <button
      id="textToolButton"
      aria-label="Texto"
      title="Texto">

      T

    </button>

    <span>
      
    </span>

  </div>

</div>


    <!-- =================================================
         FERRAMENTAS
         ================================================= -->

    <div
      id="tools"
      class="panel"
      aria-hidden="true">


      <div class="colors">


        <button
          class="color active"
          style="background:#fff"
          data-color="#fff"
          aria-label="Branco">
        </button>


        <button
          class="color"
          style="background:#ff3b30"
          data-color="#ff3b30"
          aria-label="Vermelho">
        </button>


        <button
          class="color"
          style="background:#ffcc00"
          data-color="#ffcc00"
          aria-label="Amarelo">
        </button>


        <button
          class="color"
          style="background:#34c759"
          data-color="#34c759"
          aria-label="Verde">
        </button>


        <button
          class="color"
          style="background:#0a84ff"
          data-color="#0a84ff"
          aria-label="Azul">
        </button>


      </div>


      <div class="row">

        Espessura

        <input
          id="width"
          type="range"
          min="2"
          max="32"
          value="5">

      </div>


      <div class="row">


        <button
          id="eraser"
          aria-label="Borracha"
          title="Borracha"
          style="width:40px;height:40px">


          <svg viewBox="0 0 24 24">

            <path
              d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L13 3.2c.8-.8.8-2 0-2.8l5 5c.8.8.8 2 0 2.8L11 20">
            </path>

          </svg>


        </button>


        <span id="toolName">
          Caneta
        </span>


      </div>


    </div>


    <!-- =================================================
         COLAR
         ================================================= -->

  <div id="canvasMenu">


    </div>


    <!-- =================================================
         CANCELAR IMAGEM
         ================================================= -->

    <button id="objectCancel">

      Cancelar

    </button>


    <!-- =================================================
         EDITOR DE TEXTO
         ================================================= -->

    <div
      id="inlineEditor"
      contenteditable="true"
      spellcheck="true"
      role="textbox"
      aria-label="Editar texto">
    </div>


    <!-- =================================================
         BOTÃO GRAVAR
         ================================================= -->

    <div
      id="bottom"
      class="bar">

      <button
        id="record"
        aria-label="Gravar"
        title="Gravar">

        <span></span>

      </button>

    </div>


    <div id="status"></div>


  </div>


  <!-- =================================================
       TELA INICIAL
       ================================================= -->
      
      
       <div id="startOverlay">


    <div id="startCard">


      <img
        src="./logo.png"
        alt="Lousa Cam Logo"
        class="intro-logo">


      <h1>
        LOUSA CAM 2.0
      </h1>


      <p>

        Ative a câmera e o microfone
        para usar a lousa sobre a imagem.
        Para melhor experiência no iPhone,
        use o aparelho na horizontal.

      </p>

  <button
  id="startBtn"
  type="button">

  Ativar câmera e microfone

</button>

      <div id="permissionHint">

        O Safari solicitará as permissões.

      </div>


    </div>


  </div>


</div>


<script src="./app.js?v=20260910-01"></script>

</body>

</html>
