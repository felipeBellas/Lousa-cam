<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lousa Cam - Desenho por Gestos (MediaPipe)</title>

  <!-- Bibliotecas do MediaPipe via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
    }

    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    #btn-start {
      background: #34c759;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Feedback visual da ponta do dedo */
    #pointer-indicator {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: rgba(255, 59, 48, 0.6);
      z-index: 10;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      transition: background 0.1s;
    }

    .top-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #status-badge {
      margin-left: auto;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b30;
    }

    .dot.active {
      background: #34c759;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="start-overlay">
      <h2>Lousa Cam - Desenho no Ar</h2>
      <p style="margin-top: 10px; max-width: 400px; line-height: 1.5;">
        • <strong>Mova o indicador:</strong> Controla o cursor na tela.<br/>
        • <strong>Junte Polegar + Indicador (Pinch):</strong> Ativa a caneta para desenhar.
      </p>
      <button id="btn-start">Iniciar MediaPipe</button>
    </div>

    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="pointer-indicator"></div>

    <div class="top-controls">
      <button class="action-btn" id="btn-clear">Limpar Tela</button>
      <button class="action-btn" id="btn-color">Mudar Cor</button>
      <div id="status-badge">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Procurando Mão...</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
