<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Lousa Cam</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }

    /* =========================================================
       BARRA SUPERIOR
       ========================================================= */

    #top {
      position: absolute;
      z-index: 20;
      top: env(safe-area-inset-top, 8px);
      left: 8px;
      right: 8px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      pointer-events: none;
    }

    #left,
    #right {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      pointer-events: auto;
    }

    button {
      border: 0;
      outline: none;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 46px;
      height: 46px;

      padding: 0;

      border-radius: 12px;

      background: rgba(20, 20, 20, 0.78);
      color: white;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.25);

      flex: 0 0 46px;
    }

    button:active {
      transform: scale(0.94);
    }

    button svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }

    /* Botão T */
    #textToolButton {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
    }

    /* =========================================================
       BOTÃO GRAVAÇÃO
       ========================================================= */

    #record {
      position: absolute;
      z-index: 30;

      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));

      transform: translateX(-50%);

      width: 64px;
      height: 64px;

      border-radius: 50%;

      background: rgba(210, 30, 30, 0.95);

      border: 4px solid rgba(255, 255, 255, 0.9);
    }

    #record.recording {
      background: #fff;
    }

    #record.recording::after {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: #d71919;
    }

    /* =========================================================
       MENU DE AÇÕES DO CANVAS
       ========================================================= */

    #canvasMenu {
      position: fixed;
      z-index: 100;

      display: none;

      min-width: 230px;
      max-width: calc(100vw - 20px);

      padding: 8px;

      background: rgba(25, 25, 25, 0.96);
      border-radius: 16px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    #canvasMenu.show {
      display: block;
    }

    #canvasMenu button {
      width: 100%;
      height: 46px;

      flex: none;

      justify-content: flex-start;

      padding: 0 14px;

      background: transparent;

      border-radius: 10px;

      font-size: 16px;
      font-weight: 500;
    }

    #canvasMenu button:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    #canvasMenu button:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* =========================================================
       PAINEL DE FERRAMENTAS
       ========================================================= */

    #tools {
      position: absolute;
      z-index: 40;

      top: calc(62px + env(safe-area-inset-top, 0px));
      left: 8px;

      display: none;

      padding: 12px;

      border-radius: 16px;

      background: rgba(20, 20, 20, 0.92);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #tools.show {
      display: block;
    }

    #tools label {
      display: block;

      margin-bottom: 8px;

      color: #fff;

      font-size: 13px;
    }

    #tools input {
      width: 150px;
    }

    #toolName {
      color: #fff;
      font-size: 13px;
      margin-top: 8px;
    }

    /* =========================================================
       OVERLAY INICIAL
       ========================================================= */

    #startOverlay {
      position: absolute;
      inset: 0;

      z-index: 200;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(0, 0, 0, 0.94);
    }

    #startOverlay.hidden {
      display: none;
    }

    #startBox {
      width: min(420px, 100%);

      padding: 28px 22px;

      text-align: center;

      color: white;

      border-radius: 22px;

      background: rgba(30, 30, 30, 0.96);

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.45);
    }

    #startBox h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    #startBox p {
      margin: 0 0 22px;

      color: #ccc;

      font-size: 15px;
      line-height: 1.5;
    }

    #startBtn {
      width: 100%;
      height: 52px;

      flex: none;

      background: #fff;
      color: #111;

      font-size: 16px;
      font-weight: 700;

      border-radius: 13px;
    }

    #status {
      margin-top: 12px;

      min-height: 18px;

      color: #aaa;

      font-size: 12px;
    }

    /* =========================================================
       ÁREA AUXILIAR PARA COLAR
       ========================================================= */

    #pasteOverlay {
      position: fixed;
      inset: 0;

      z-index: 180;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.72);
    }

    #pasteOverlay.show {
      display: flex;
    }

    #pasteBox {
      width: min(440px, 100%);

      padding: 20px;

      border-radius: 18px;

      background: #202020;
      color: #fff;

      text-align: center;
    }

    #pasteBox h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    #pasteBox p {
      margin: 0 0 14px;

      color: #bbb;

      font-size: 14px;
      line-height: 1.4;
    }

    #pasteArea {
      width: 100%;
      min-height: 90px;

      padding: 12px;

      border-radius: 10px;

      background: #fff;
      color: #111;

      text-align: left;

      font-size: 16px;

      user-select: text;
      -webkit-user-select: text;

      outline: none;
    }

    #pasteCancel {
      width: 100%;
      height: 44px;

      margin-top: 12px;

      flex: none;

      background: #444;

      color: #fff;

      font-size: 15px;
    }

    /* =========================================================
       RESPONSIVO - CELULAR
       ========================================================= */

    @media (max-width: 600px) {

      #top {
        left: 5px;
        right: 5px;
      }

      #left,
      #right {
        gap: 3px;
      }

      #left button,
      #right button {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
        border-radius: 10px;
      }

      #left button svg,
      #right button svg {
        width: 18px;
        height: 18px;
      }

      #textToolButton {
        font-size: 19px;
      }
    }

    @media (max-width: 390px) {

      #top {
        left: 3px;
        right: 3px;
      }

      #left,
      #right {
        gap: 2px;
      }

      #left button,
      #right button {
        width: 37px;
        height: 37px;
        flex-basis: 37px;
        border-radius: 9px;
      }

      #left button svg,
      #right button svg {
        width: 17px;
        height: 17px;
      }

      #textToolButton {
        font-size: 18px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {

      #left,
      #right {
        gap: 3px;
      }

      #left button,
      #right button {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <canvas id="canvas"></canvas>

  <!-- =======================================================
       BARRA SUPERIOR
       ======================================================= -->

  <div id="top">

    <div id="left">

      <!-- MENU -->
      <button id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- DESFAZER -->
      <button id="undo" aria-label="Desfazer">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M9 14L4 9l5-5"/>
          <path d="M4 9h10a6 6 0 0 1 0 12h-2"/>
        </svg>
      </button>

      <!-- REFAZER -->
      <button id="redo" aria-label="Refazer">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M15 14l5-5-5-5"/>
          <path d="M20 9H10a6 6 0 0 0 0 12h2"/>
        </svg>
      </button>

      <!-- LIMPAR -->
      <button id="clear" aria-label="Limpar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M4 7h16"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M6 7l1 13h10l1-13"/>
          <path d="M9 7V4h6v3"/>
        </svg>
      </button>

      <!-- NOVO BOTÃO T -->
      <button
        id="textToolButton"
        aria-label="Adicionar texto"
        title="Texto"
      >
        T
      </button>

    </div>

    <div id="right">

      <!-- INVERTER CÂMERA -->
      <button id="flip" aria-label="Inverter câmera">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M3 7h4l2-3h6l2 3h4v12H3z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>

      <!-- CONFIGURAÇÕES -->
      <button id="settings" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20h-2.5v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6V11.5h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L9 6.7l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5h2.5v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1V14h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>

    </div>

  </div>

  <!-- =======================================================
       PAINEL DE FERRAMENTAS
       ======================================================= -->

  <div id="tools">

    <label>
      Cor
      <br>
      <input
        id="color"
        type="color"
        value="#ffffff"
      >
    </label>

    <label>
      Espessura
      <br>
      <input
        id="width"
        type="range"
        min="1"
        max="40"
        value="5"
      >
    </label>

    <button id="eraser" aria-label="Borracha">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M20 20H8l-5-5 10-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-7 7"/>
        <path d="M6 14l4 4"/>
      </svg>
    </button>

    <div id="toolName">
      Caneta
    </div>

  </div>

  <!-- =======================================================
       MENU AO TOCAR NA LOUSA
       ======================================================= -->

  <div id="canvasMenu">

    <button data-action="text">
      <span>Texto</span>
    </button>

    <button data-action="image">
      <span>Imagem</span>
    </button>

    <button data-action="paste">
      <span>Conteúdo da área de transferência</span>
    </button>

    <button data-action="cancel">
      <span>Cancelar</span>
    </button>

  </div>

  <!-- INPUT DE IMAGEM -->
  <input
    id="imageInput"
    type="file"
    accept="image/*"
    hidden
  >

  <!-- =======================================================
       AUXILIAR DE COLAGEM
       ======================================================= -->

  <div id="pasteOverlay">

    <div id="pasteBox">

      <h2>Colar conteúdo</h2>

      <p>
        Toque na área abaixo e use o comando
        <strong>Colar</strong> do Safari.
        Texto ou imagem poderão ser adicionados à lousa.
      </p>

      <div
        id="pasteArea"
        contenteditable="true"
        tabindex="0"
      ></div>

      <button id="pasteCancel">
        Cancelar
      </button>

    </div>

  </div>

  <!-- =======================================================
       GRAVAÇÃO
       ======================================================= -->

  <button
    id="record"
    aria-label="Gravar"
  ></button>

  <!-- =======================================================
       TELA INICIAL
       ======================================================= -->

  <div id="startOverlay">

    <div id="startBox">

      <h1>Lousa Cam</h1>

      <p>
        Para começar, permita o acesso à câmera
        e ao microfone.
      </p>

      <button id="startBtn">
        Iniciar câmera
      </button>

      <div id="status"></div>

    </div>

  </div>

</div>

<script src="./app.js?v=20260910-01"></script>

</body>
</html>
