<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lousa Cam PWA V2</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
      z-index: 1;
      background-color: #000;
    }
    video.rear-camera {
      transform: scaleX(1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }

    /* ESTILOS COMUNS PARA BOTÕES E PAINÉIS */
    .btn {
      background: #2a2a2a;
      border: none;
      color: #fff;
      padding: 10px;
      width: 100%;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .btn:active { background: #444; }
    .btn.active { background: #007aff; }

    /* MENU LATERAL INDEPENDENTE: CANETA (Lado Esquerdo) */
    .pen-side-wrapper {
      position: absolute;
      top: 20px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .pen-side-toggle {
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    .pen-side-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      width: 140px;
    }

    .pen-side-wrapper.collapsed .pen-side-content {
      display: none;
    }

    .color-picker { 
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      justify-items: center;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }
    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.2);
    }

    /* MENU PRINCIPAL (Rodapé Direito - Expande para Cima) */
    .toolbar-wrapper {
      position: absolute;
      bottom: 20px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: 10px;
    }

    .toolbar-wrapper.collapsed .toolbar-content {
      display: none;
    }

    .toggle-btn {
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 12px 22px;
      border-radius: 22px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }

    .toolbar-content {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      padding: 14px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      max-height: 70vh;
      overflow-y: auto;
    }

    .action-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .action-group .btn {
      padding: 8px;
    }

    input[type="range"] { 
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <!-- 1. MENU LATERAL INDEPENDENTE DA CANETA -->
    <div class="pen-side-wrapper" id="penSideWrapper">
      <button class="pen-side-toggle" id="btn-toggle-pen">🎨 Caneta ▶</button>
      
      <div class="pen-side-content">
        <div class="color-picker">
          <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
          <div class="color-dot" style="background: #000000;" data-color="#000000"></div>
          <div class="color-dot" style="background: #ff3b30;" data-color="#ff3b30"></div>
          <div class="color-dot" style="background: #ffcc00;" data-color="#ffcc00"></div>
          <div class="color-dot" style="background: #34c759;" data-color="#34c759"></div>
          <div class="color-dot" style="background: #007aff;" data-color="#007aff"></div>
        </div>
        <input type="range" id="lineWidth" min="2" max="30" value="5">
      </div>
    </div>

    <!-- 2. MENU PRINCIPAL NO RODAPÉ -->
    <div class="toolbar-wrapper" id="toolbarWrapper">
      <button class="toggle-btn" id="btn-toggle-menu">⚙️ MENU</button>
      
      <div class="toolbar-content">
        <button id="btn-flip" class="btn">🔄 Cam</button>
        <button id="btn-eraser" class="btn">✏️ Borracha</button>

        <div class="action-group">
          <button id="btn-undo" class="btn">↩️</button>
          <button id="btn-redo" class="btn">↪️</button>
        </div>

        <button id="btn-clear-all" class="btn" style="background: #d9534f;">💥 Limpar</button>
        <button id="btn-rec-mode" class="btn" style="background: #444;">📹 Vídeo</button>
        <button id="btn-record" class="btn" style="background: #ff3b30;">🔴 Gravar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
