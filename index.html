<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover
    "
  >

  <meta name="theme-color" content="#000000">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Lousa Cam"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Lousa Cam 2.0</title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #fff;

      touch-action: none;

      overscroll-behavior: none;

      -webkit-user-select: none;
      user-select: none;
    }


    body {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #000;
    }


    /* =====================================================
       ÁREA PRINCIPAL
    ===================================================== */

    #app {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }


    /* =====================================================
       CÂMERA
    ===================================================== */

    #video {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

      z-index: 1;

      transform: scaleX(1);

      -webkit-transform: scaleX(1);
    }


    /* =====================================================
       CANVAS DA LOUSA
    ===================================================== */

    #canvas {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 5;

      touch-action: none;

      pointer-events: auto;
    }


    /* =====================================================
       BARRA SUPERIOR
    ===================================================== */

    #topBar {

      position: absolute;

      z-index: 20;

      top: 0;
      left: 0;
      right: 0;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding:

        calc(
          10px +
          env(safe-area-inset-top, 0px)
        )

        calc(
          12px +
          env(safe-area-inset-right, 0px)
        )

        10px

        calc(
          12px +
          env(safe-area-inset-left, 0px)
        );

      pointer-events: none;
    }


    #topBarLeft,
    #topBarRight {

      display: flex;

      align-items: center;

      gap: 8px;

      pointer-events: auto;
    }


    /* =====================================================
       BOTÕES
    ===================================================== */

    .topButton {

      width: 46px;
      height: 46px;

      padding: 0;

      border: 1px solid rgba(255,255,255,.18);

      border-radius: 14px;

      background:
        rgba(20,20,20,.72);

      color: #fff;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 4px 15px rgba(0,0,0,.25);

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;

      touch-action: manipulation;
    }


    .topButton:active {

      transform: scale(.92);

      background:
        rgba(255,255,255,.18);
    }


    .topButton svg {

      width: 23px;
      height: 23px;

      display: block;

      stroke: currentColor;

      fill: none;

      stroke-width: 2;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* =====================================================
       ÍCONE PROFISSIONAL DE TROCA DE CÂMERA
    ===================================================== */

    #flip svg {

      width: 26px;
      height: 26px;

      stroke-width: 2.1;
    }


    /*
      Pequeno destaque visual para o botão
      de troca de câmera
    */

    #flip {

      border-color:
        rgba(255,255,255,.28);

      background:
        rgba(15,15,15,.78);
    }


    /* =====================================================
       MENU
    ===================================================== */

    #menuPanel {

      position: absolute;

      z-index: 25;

      top:
        calc(
          66px +
          env(safe-area-inset-top, 0px)
        );

      left:
        calc(
          12px +
          env(safe-area-inset-left, 0px)
        );

      width: min(300px, calc(100vw - 24px));

      padding: 14px;

      border:
        1px solid rgba(255,255,255,.14);

      border-radius: 18px;

      background:
        rgba(18,18,18,.94);

      box-shadow:
        0 15px 45px rgba(0,0,0,.45);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      display: none;
    }


    #menuPanel.open {

      display: block;
    }


    /* =====================================================
       FERRAMENTAS
    ===================================================== */

    #tools {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 8px;
    }


    #tools button {

      min-width: 42px;
      height: 42px;

      padding: 0 12px;

      border: 1px solid rgba(255,255,255,.15);

      border-radius: 12px;

      background: #252525;

      color: #fff;

      font-size: 14px;

      cursor: pointer;

      touch-action: manipulation;
    }


    #tools button:active {

      transform: scale(.95);
    }


    /* =====================================================
       GRAVAÇÃO
    ===================================================== */

    #record {

      position: absolute;

      z-index: 20;

      right:
        calc(
          14px +
          env(safe-area-inset-right, 0px)
        );

      bottom:
        calc(
          14px +
          env(safe-area-inset-bottom, 0px)
        );

      min-width: 100px;

      height: 44px;

      padding: 0 16px;

      border: 1px solid rgba(255,255,255,.2);

      border-radius: 22px;

      background:
        rgba(20,20,20,.82);

      color: #fff;

      font-weight: 600;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      cursor: pointer;

      touch-action: manipulation;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    #status {

      position: absolute;

      z-index: 20;

      left: 50%;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom, 0px)
        );

      transform: translateX(-50%);

      max-width: calc(100vw - 240px);

      padding: 7px 12px;

      border-radius: 12px;

      background:
        rgba(0,0,0,.55);

      color: rgba(255,255,255,.9);

      font-size: 12px;

      text-align: center;

      pointer-events: none;
    }


    /* =====================================================
       TELA INICIAL / PERMISSÃO
    ===================================================== */

    #startOverlay {

      position: fixed;

      z-index: 100;

      inset: 0;

      width: 100%;

      /*
        Importante para iPhone:
        usa a altura dinâmica real da viewport.
      */

      height: 100vh;
      height: 100dvh;

      min-height: 100vh;
      min-height: 100dvh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:

        calc(
          24px +
          env(safe-area-inset-top, 0px)
        )

        calc(
          20px +
          env(safe-area-inset-right, 0px)
        )

        calc(
          24px +
          env(safe-area-inset-bottom, 0px)
        )

        calc(
          20px +
          env(safe-area-inset-left, 0px)
        );

      background: #000;

      color: #fff;

      text-align: center;

      overflow: hidden;
    }


    #startOverlay.hidden {

      display: none;
    }


    /* =====================================================
       CARTÃO INICIAL
    ===================================================== */

    #startCard {

      position: static;

      width: min(420px, 100%);

      max-width: 420px;

      margin: 0 auto;

      padding: 0;

      transform: none;

      -webkit-transform: none;

      text-align: center;
    }


    /* =====================================================
       ÍCONE DA LOUSA
    ===================================================== */

    #startLogo {

      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      border-radius: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #242424,
          #111
        );

      border:
        1px solid rgba(255,255,255,.15);

      box-shadow:
        0 12px 35px rgba(0,0,0,.35);
    }


    #startLogo svg {

      width: 42px;
      height: 42px;

      stroke: #fff;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* =====================================================
       TÍTULO
    ===================================================== */

    #startCard h1 {

      margin: 0 0 12px;

      font-size: 28px;

      line-height: 1.15;

      font-weight: 700;

      letter-spacing: -.4px;
    }


    /* =====================================================
       TEXTO
    ===================================================== */

    #startCard p {

      margin: 0 auto 24px;

      max-width: 360px;

      color: rgba(255,255,255,.72);

      font-size: 16px;

      line-height: 1.5;
    }


    /* =====================================================
       BOTÃO INICIAR
    ===================================================== */

    #startBtn {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: auto;

      min-width: 250px;

      max-width: 100%;

      height: 52px;

      padding: 0 26px;

      border: 0;

      border-radius: 26px;

      background: #fff;

      color: #111;

      font-size: 16px;

      font-weight: 700;

      white-space: nowrap;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0,0,0,.35);

      transition:
        transform .15s ease,
        opacity .15s ease;

      touch-action: manipulation;
    }


    #startBtn:active {

      transform: scale(.96);

      opacity: .9;
    }


    /* =====================================================
       AVISO DE PERMISSÃO
    ===================================================== */

    #permissionHint {

      margin-top: 14px;

      color: rgba(255,255,255,.48);

      font-size: 12px;

      line-height: 1.4;
    }


    /* =====================================================
       TELAS PEQUENAS
    ===================================================== */

    @media (max-height: 700px) {

      #startLogo {

        width: 60px;
        height: 60px;

        margin-bottom: 12px;
      }


      #startLogo svg {

        width: 34px;
        height: 34px;
      }


      #startCard h1 {

        font-size: 23px;

        margin-bottom: 8px;
      }


      #startCard p {

        font-size: 14px;

        margin-bottom: 15px;
      }


      #startBtn {

        height: 48px;

        font-size: 15px;
      }


      #permissionHint {

        margin-top: 9px;
      }

    }


    /* =====================================================
       IPHONE EM RETRATO
    ===================================================== */

    @media (orientation: portrait) {

      #startCard {

        width: min(
          420px,
          calc(100vw - 32px)
        );
      }

    }


    /* =====================================================
       MODO PAISAGEM
    ===================================================== */

    @media (orientation: landscape) {

      #startCard {

        width: min(
          520px,
          calc(100vw - 40px)
        );
      }

    }


    /* =====================================================
       REDUÇÃO DE MOVIMENTO
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      * {

        transition: none !important;

        animation: none !important;
      }

    }

  </style>

</head>


<body>

  <div id="app">


    <!-- ==================================================
         CÂMERA
    ================================================== -->

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <!-- ==================================================
         LOUSA
    ================================================== -->

    <canvas id="canvas"></canvas>


    <!-- ==================================================
         BARRA SUPERIOR
    ================================================== -->

    <div id="topBar">


      <div id="topBarLeft">


        <!-- MENU -->

        <button
          id="menuBtn"
          class="topButton"
          type="button"
          aria-label="Abrir menu"
          title="Menu"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M4 6h16"></path>

            <path d="M4 12h16"></path>

            <path d="M4 18h16"></path>

          </svg>

        </button>


        <!-- DESFAZER -->

        <button
          id="undo"
          class="topButton"
          type="button"
          aria-label="Desfazer"
          title="Desfazer"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M9 14L4 9l5-5"></path>

            <path
              d="M4 9h10a6 6 0 0 1 6 6v1"
            ></path>

          </svg>

        </button>


        <!-- REFAZER -->

        <button
          id="redo"
          class="topButton"
          type="button"
          aria-label="Refazer"
          title="Refazer"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M15 14l5-5-5-5"></path>

            <path
              d="M20 9H10a6 6 0 0 0-6 6v1"
            ></path>

          </svg>

        </button>


      </div>


      <div id="topBarRight">


        <!-- LIMPAR -->

        <button
          id="clear"
          class="topButton"
          type="button"
          aria-label="Limpar lousa"
          title="Limpar"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path d="M4 7h16"></path>

            <path d="M10 11v6"></path>

            <path d="M14 11v6"></path>

            <path
              d="M6 7l1 13h10l1-13"
            ></path>

            <path
              d="M9 7V4h6v3"
            ></path>

          </svg>

        </button>


        <!-- =================================================
             TROCAR CÂMERA
             
             ÍCONE SVG ORIGINAL:
             duas setas circulares + câmera
        ================================================== -->

        <button
          id="flip"
          class="topButton"
          type="button"
          aria-label="Trocar câmera"
          title="Trocar câmera"
        >

          <svg
            viewBox="0 0 32 32"
            aria-hidden="true"
          >

            <!-- Corpo da câmera -->

            <path
              d="
                M10.5 12.5
                h2.2
                l1.8-2.5
                h3
                l1.8 2.5
                h2.2
                a2.5 2.5 0 0 1 2.5 2.5
                v7
                a2.5 2.5 0 0 1-2.5 2.5
                h-11
                A2.5 2.5 0 0 1 8 22
                v-7
                a2.5 2.5 0 0 1 2.5-2.5
              "
            ></path>


            <!-- Lente -->

            <circle
              cx="16"
              cy="18.5"
              r="3.5"
            ></circle>


            <!-- Seta superior -->

            <path
              d="
                M7 9.5
                A10 10 0 0 1 23 7
              "
            ></path>

            <path
              d="M20.5 5.5L23 7l-1.5 2.5"
            ></path>


            <!-- Seta inferior -->

            <path
              d="
                M25 23.5
                A10 10 0 0 1 9 26
              "
            ></path>

            <path
              d="M11.5 27.5L9 26l1.5-2.5"
            ></path>

          </svg>

        </button>


        <!-- CONFIGURAÇÕES -->

        <button
          id="settings"
          class="topButton"
          type="button"
          aria-label="Configurações"
          title="Configurações"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              cx="12"
              cy="12"
              r="3"
            ></circle>

            <path
              d="
                M19.4 15
                a1.7 1.7 0 0 0 .3 1.9
                l.1.1-1.8 1.8-.1-.1
                a1.7 1.7 0 0 0-1.9-.3
                1.7 1.7 0 0 0-1 1.5V20
                h-2.5v-.1
                a1.7 1.7 0 0 0-1-1.5
                1.7 1.7 0 0 0-1.9.3
                l-.1.1-1.8-1.8.1-.1
                A1.7 1.7 0 0 0 8 15
                a1.7 1.7 0 0 0-1.5-1H6v-2.5h.5
                A1.7 1.7 0 0 0 8 10
                a1.7 1.7 0 0 0-.3-1.9
                l-.1-.1 1.8-1.8.1.1
                a1.7 1.7 0 0 0 1.9.3
                1.7 1.7 0 0 0 1-1.5V5h2.5v.1
                a1.7 1.7 0 0 0 1 1.5
                1.7 1.7 0 0 0 1.9-.3
                l.1-.1 1.8 1.8-.1.1
                a1.7 1.7 0 0 0-.3 1.9
                1.7 1.7 0 0 0 1.5 1h.1V14h-.1
                a1.7 1.7 0 0 0-1.5 1z
              "
            ></path>

          </svg>

        </button>


      </div>

    </div>


    <!-- ==================================================
         MENU LATERAL
    ================================================== -->

    <div id="menuPanel">

      <div id="tools">

        <button
          id="penBlack"
          type="button"
        >
          Preto
        </button>

        <button
          id="penWhite"
          type="button"
        >
          Branco
        </button>

        <button
          id="penRed"
          type="button"
        >
          Vermelho
        </button>

        <button
          id="penBlue"
          type="button"
        >
          Azul
        </button>

        <button
          id="eraser"
          type="button"
        >
          Borracha
        </button>

      </div>

    </div>


    <!-- ==================================================
         GRAVAÇÃO
    ================================================== -->

    <button
      id="record"
      type="button"
    >
      ● Gravar
    </button>


    <!-- ==================================================
         STATUS
    ================================================== -->

    <div
      id="status"
      aria-live="polite"
    >
      Lousa Cam pronta
    </div>


    <!-- ==================================================
         TELA DE INÍCIO / PERMISSÃO
    ================================================== -->

    <div id="startOverlay">

      <div id="startCard">


        <!-- LOGO -->

        <div id="startLogo">

          <svg
            viewBox="0 0 48 48"
            aria-hidden="true"
          >

            <rect
              x="7"
              y="9"
              width="34"
              height="25"
              rx="3"
            ></rect>

            <path
              d="M13 39h22"
            ></path>

            <path
              d="M24 34v5"
            ></path>

            <path
              d="M13 27l7-8 5 5 4-5 6 8"
            ></path>

          </svg>

        </div>


        <h1>
          Lousa Cam 2.0
        </h1>


        <p>
          Ative a câmera e o microfone para utilizar
          a lousa digital e registrar suas aulas.
        </p>


        <button
          id="startBtn"
          type="button"
        >
          Ativar câmera e microfone
        </button>


        <div id="permissionHint">

          O navegador solicitará a permissão
          para câmera e microfone.

        </div>


      </div>

    </div>


  </div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script src="./app.js"></script>


</body>

</html>
