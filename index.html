  <style>

    :root {

      --glass: rgba(22, 22, 26, 0.72);

      --border: rgba(255, 255, 255, 0.18);

    * {

      box-sizing: border-box;

      user-select: none;

      -webkit-user-select: none;

      -webkit-touch-callout: none;

    }

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;
  min-height: 100%;

  overflow: hidden;

  background: #000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Roboto,
    sans-serif;

  overscroll-behavior: none;

  -webkit-overflow-scrolling: auto;
}


body {

  overscroll-behavior: none;

  touch-action: none;

}
    
    #app {

  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;

  height: 100vh;
  height: 100dvh;

  background: #000;

  overflow: hidden;
}


    #video,
    #canvas {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

    }


    #video {
  z-index: 1;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center center;

  background: #000;
}


    #video.mirror {

      transform: scaleX(-1);

    }


    #canvas {

      z-index: 2;

      touch-action: none;

    }


    #ui {

      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

    }


    /* =====================================================
       BARRA ORIGINAL
       ===================================================== */

    .bar {

      position: absolute;

      display: flex;

      align-items: center;

      gap: 10px;

      pointer-events: auto;

    }


    #top {

      left:
        max(16px, env(safe-area-inset-left));

      right:
        max(16px, env(safe-area-inset-right));

      top:
        max(16px, env(safe-area-inset-top));

      justify-content:
        space-between;

    }


    #left,
    #right {

      display: flex;

      gap: 10px;

      align-items: center;

    }


    #bottom {

  left: 0;

  right: 0;

  bottom:
    max(
      82px,
      calc(
        env(safe-area-inset-bottom)
        + 82px
      )
    );

  justify-content: center;

}

    button {

      width: 38px;

      height: 38px;

      border-radius: 50%;

      border:
        1px solid var(--border);

      background:
        var(--glass);

      color: #fff;

     backdrop-filter:
     blur(8px);

    -webkit-backdrop-filter:
     blur(8px);

      display: flex;

      align-items: center;

      justify-content: center;

     box-shadow:
     0 2px 8px
     rgba(0, 0, 0, 0.22);

      cursor: pointer;

      padding: 0;

      transition:
        transform 0.15s ease,
        background-color 0.2s ease;

    }


    button svg {

      width: 22px;

      height: 22px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    button:active {

      transform: scale(0.92);

    }


    button:disabled {

      opacity: 0.35;

    }


    /* =====================================================
       T — ÚNICO BOTÃO NOVO
       Não modifica os botões originais.
       ===================================================== */

    #textToolButton {

      position: absolute;

      left: 65%;

      top: 0;

      transform:
        translateX(-50%);

      z-index: 30;

      font-size: 20px;

      font-weight: 700;

      font-family: Arial, sans-serif;

      pointer-events: auto;

        backdrop-filter: none;

  -webkit-backdrop-filter: none;

  box-shadow: none;

    }


    #textToolButton:active {

      transform:
        translateX(-50%)
        scale(0.92);

    }


    /* =====================================================
       GRAVAÇÃO
       ===================================================== */

    #record {

      width: 64px;

      height: 64px;

      border:
        3px solid rgba(255, 255, 255, 0.85);

      background:
        rgba(0, 0, 0, 0.4);

    }


    #record span {

      width: 28px;

      height: 28px;

      border-radius: 50%;

      background: #ff3b30;

      transition:
        all 0.25s
        cubic-bezier(0.4, 0, 0.2, 1);

    }


    #record.recording span {

      border-radius: 6px;

      width: 22px;

      height: 22px;

      background: #fff;

    }


    /* =====================================================
   NAVEGAÇÃO CÂMERA / GALERIA
   Liquid Glass
   ===================================================== */

#modeDock {

  position: absolute;

  left: 50%;

  bottom:
    max(
      18px,
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  z-index: 35;

  display: flex;

  align-items: center;

  gap: 3px;

  padding: 4px;

  border:
    1px solid
    rgba(255, 255, 255, 0.20);

  border-radius: 24px;

  background:
    rgba(28, 28, 30, 0.24);

  backdrop-filter:
    blur(22px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(180%);

  box-shadow:
    inset 0 1px 0
    rgba(255, 255, 255, 0.18);

  pointer-events: auto;

  opacity: 0.48;

  transition:
    opacity 0.25s ease,
    background 0.25s ease;

}


#modeDock.active {

  opacity: 1;

  background:
    rgba(28, 28, 30, 0.38);

}


#modeDock button {

  width: auto;

  min-width: 82px;

  height: 38px;

  padding:
    0 15px;

  border: 0;

  border-radius: 19px;

  background:
    transparent;

  box-shadow:
    none;

  color:
    rgba(255, 255, 255, 0.72);

  font-size: 13px;

  font-weight: 600;

  backdrop-filter: none;

  -webkit-backdrop-filter: none;

}


#modeDock button.active {

  color: #fff;

  background:
    rgba(255, 255, 255, 0.16);

  box-shadow:
    inset 0 1px 0
    rgba(255, 255, 255, 0.20);

}


/* =====================================================
   CAMADA INTERNA DA GALERIA
   ===================================================== */

#galleryLayer {

  position: absolute;

  inset: 0;

  z-index: 34;

  display: none;

  overflow-y: auto;

  background:

  pointer-events: auto;

  padding:

    max(16px, env(safe-area-inset-right))

}


#galleryLayer.show {

  display: block;

}


#galleryLayer h1 {

}


#galleryLayerContent {

}


#galleryLayerContent p {

  text-align: center;

  font-size: 15px;

  margin:
    24px 0;

}
    
    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      position: absolute;

      left: 50%;

            env(safe-area-inset-top)

      transform:

      padding:

      border-radius: 20px;

      background:
        rgba(18, 18, 20, 0.85);

      border:

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      color: #fff;

      font-size: 13px;

      font-weight: 500;

      opacity: 0;

      transition:
        opacity 0.25s ease;

      pointer-events: none;

      white-space: nowrap;

      z-index: 100;

    }


    #status.show {

      opacity: 1;

    }


    /* =====================================================
       PAINÉIS ORIGINAIS
       ===================================================== */

    .panel {

      position: absolute;

      top:
        max(
          72px,
          calc(
            env(safe-area-inset-top)
            + 60px
          )
        );

      right:
        max(
          16px,
          env(safe-area-inset-right)

      padding: 16px;

      border-radius: 22px;

      background:
        rgba(22, 22, 26, 0.88);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(24px);

      -webkit-backdrop-filter:
        blur(24px);

      display: none;

      pointer-events: auto;

      box-shadow:

      z-index: 40;

/* =====================================================

#menuPanel {

      display: block;

<script>

(() => {

  const modeDock =
    document.getElementById(
      "modeDock"
    );

  const cameraButton =
    document.getElementById(
      "cameraModeButton"
    );

  const galleryButton =
    document.getElementById(
      "galleryModeButton"
    );

  const galleryLayer =
    document.getElementById(
      "galleryLayer"
    );

  if (
    !modeDock ||
    !cameraButton ||
    !galleryButton ||
    !galleryLayer
  ) {
    return;
  }


  let dockTimer =
    null;


  function activateDock() {

    modeDock.classList.add(
      "active"
    );

    clearTimeout(
      dockTimer
    );

    dockTimer =
      setTimeout(
        () => {

          modeDock.classList.remove(
            "active"
          );

        },
        2200
      );

  }


  function showCamera() {

    galleryLayer.classList.remove(
      "show"
    );

    galleryLayer.setAttribute(
      "aria-hidden",
      "true"
    );

    cameraButton.classList.add(
      "active"
    );

    galleryButton.classList.remove(
      "active"
    );

    cameraButton.setAttribute(
      "aria-pressed",
      "true"
    );

    galleryButton.setAttribute(
      "aria-pressed",
      "false"
    );

    activateDock();

  }


  function showGallery() {
   
    if (
    typeof window.loadGallery ===
   "function"
    ) {

    window.loadGallery();

    }
    galleryLayer.classList.add(
      "show"
    );

    galleryLayer.setAttribute(
      "aria-hidden",
      "false"
    );

    cameraButton.classList.remove(
      "active"
    );

    galleryButton.classList.add(
      "active"
    );

    cameraButton.setAttribute(
      "aria-pressed",
      "false"
    );

    galleryButton.setAttribute(
      "aria-pressed",
      "true"
    );

    activateDock();

  }


  cameraButton.addEventListener(
    "click",
    showCamera
  );


  galleryButton.addEventListener(
    "click",
    showGallery
  );


  modeDock.addEventListener(
    "pointerdown",
    activateDock
  );


  /*
    O aplicativo sempre inicia
    visualmente na Câmera.
  */
  showCamera();

})();

</script>
