<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="./manifest.json">

  <title>Lousa Cam 2.0</title>

  <style>
    :root {
      --glass: rgba(22,22,26,.72);
      --border: rgba(255,255,255,.18);
      --white: #fff;
      --blue: #0a84ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;
      color: #fff;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #camera.mirror {
      transform: scaleX(-1);
    }

    #board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      pointer-events: auto;
    }

    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* =========================
       BARRA SUPERIOR
       ========================= */

    #top {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 10px;
      right: 10px;

      height: 54px;

      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;

      pointer-events: none;
    }

    #left,
    #right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    #left {
      grid-column: 1;
      justify-content: flex-start;
    }

    #right {
      grid-column: 3;
      justify-content: flex-end;
    }

    /*
      Área central exclusiva para o T.
      Assim ele não empurra nem sobrepõe
      os botões originais.
    */
    #textToolSlot {
      grid-column: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 48px;
      height: 54px;

      pointer-events: none;
    }

    #textToolSlot button {
      pointer-events: auto;
    }

    .toolButton {
      width: 48px;
      height: 48px;

      border: 1px solid var(--border);
      border-radius: 50%;

      background: var(--glass);
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      font-weight: 500;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow:
        0 4px 18px rgba(0,0,0,.28);

      cursor: pointer;
      user-select: none;
    }

    .toolButton:active {
      transform: scale(.94);
    }

    #textToolButton {
      font-size: 19px;
      font-weight: 700;
    }

    #recordButton {
      width: 64px;
      height: 64px;
      border-radius: 50%;

      border: 2px solid rgba(255,255,255,.85);

      background: rgba(255,255,255,.12);

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: auto;
    }

    #recordButton::after {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ff3b30;
    }

    #recordButton.recording::after {
      border-radius: 5px;
    }

    /* =========================
       STATUS
       ========================= */

    #status {
      position: absolute;

      top: calc(env(safe-area-inset-top, 10px) + 64px);
      left: 50%;

      transform: translateX(-50%);

      padding: 7px 12px;

      border-radius: 18px;

      background: var(--glass);
      border: 1px solid var(--border);

      font-size: 13px;

      white-space: nowrap;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      pointer-events: none;
    }

    /* =========================
       MENUS
       ========================= */

    #menuPanel,
    #toolsPanel {
      position: absolute;

      top: calc(env(safe-area-inset-top, 10px) + 60px);

      padding: 10px;

      border-radius: 16px;

      background: var(--glass);
      border: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: 0 12px 35px rgba(0,0,0,.35);

      display: none;

      pointer-events: auto;

      z-index: 50;
    }

    #menuPanel {
      left: 10px;
      min-width: 190px;
    }

    #toolsPanel {
      right: 10px;
      min-width: 220px;
    }

    #menuPanel.open,
    #toolsPanel.open {
      display: block;
    }

    .menuItem {
      width: 100%;

      padding: 12px 14px;

      margin: 2px 0;

      border: 0;
      border-radius: 10px;

      background: transparent;
      color: #fff;

      text-align: left;

      font-size: 15px;

      cursor: pointer;
    }

    .menuItem:active {
      background: rgba(255,255,255,.12);
    }

    .panelRow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    .panelRow label {
      font-size: 14px;
      flex: 1;
    }

    #colorInput {
      width: 44px;
      height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    #widthInput {
      width: 110px;
    }

    /* =========================
       MENU COLAR DO CANVAS
       ========================= */

    #canvasMenu {
      position: absolute;

      display: none;

      z-index: 100;

      pointer-events: auto;

      padding: 6px;

      border-radius: 12px;

      background: var(--glass);
      border: 1px solid var(--border);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    #canvasMenu.open {
      display: block;
    }

    #canvasMenu button {
      border: 0;
      background: transparent;
      color: #fff;

      padding: 10px 16px;

      border-radius: 9px;

      font-size: 15px;

      cursor: pointer;
    }

    #canvasMenu button:active {
      background: rgba(255,255,255,.12);
    }

    /* =========================
       EDITOR DE TEXTO
       ========================= */

    #inlineEditor {
      position: absolute;

      display: none;

      z-index: 200;

      min-width: 80px;
      min-height: 40px;

      padding: 5px 7px;

      margin: 0;

      border: 2px dashed rgba(255,255,255,.85);

      border-radius: 5px;

      outline: none;

      background: rgba(0,0,0,.18);

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 24px;

      line-height: 1.2;

      resize: both;

      overflow: auto;

      white-space: pre-wrap;

      touch-action: auto;

      -webkit-user-select: text;
      user-select: text;
    }

    #inlineEditor.editing {
      display: block;
    }

    /* =========================
       BOTÃO CANCELAR IMAGEM
       ========================= */

    #imageCancelButton {
      position: absolute;

      display: none;

      z-index: 150;

      padding: 8px 13px;

      border-radius: 10px;

      border: 1px solid rgba(255,255,255,.22);

      background: rgba(30,30,35,.9);

      color: #fff;

      font-size: 14px;

      pointer-events: auto;
    }

    #imageCancelButton.open {
      display: block;
    }

    /* =========================
       TELA INICIAL
       ========================= */

    #startOverlay {
      position: absolute;
      inset: 0;

      z-index: 500;

      background: rgba(0,0,0,.82);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      pointer-events: auto;
    }

    #startCard {
      width: min(380px, 100%);

      padding: 30px 24px;

      border-radius: 24px;

      background: rgba(25,25,30,.86);

      border: 1px solid var(--border);

      text-align: center;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #startLogo {
      width: 110px;
      height: 110px;

      object-fit: contain;

      margin-bottom: 15px;
    }

    #startCard h1 {
      margin: 0 0 20px;

      font-size: 26px;
      font-weight: 700;
    }

    #startButton {
      width: 100%;

      border: 0;
      border-radius: 14px;

      padding: 15px;

      background: var(--blue);
      color: #fff;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
    }

    #permissionHint {
      margin: 15px 0 0;

      color: rgba(255,255,255,.68);

      font-size: 13px;

      line-height: 1.45;
    }

    /* =========================
       RESPONSIVO
       ========================= */

    @media (max-width: 600px) {

      #top {
        left: 8px;
        right: 8px;
      }

      #left,
      #right {
        gap: 5px;
      }

      .toolButton {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }

      #textToolSlot {
        min-width: 44px;
      }

      #recordButton {
        width: 58px;
        height: 58px;
      }

      #recordButton::after {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <video id="camera" autoplay playsinline muted></video>

  <canvas id="board"></canvas>

  <div id="ui">

    <!-- BARRA SUPERIOR -->
    <div id="top">

      <div id="left">

        <button id="menuBtn"
                class="toolButton"
                type="button"
                aria-label="Menu">
          ☰
        </button>

        <button id="undoBtn"
                class="toolButton"
                type="button"
                aria-label="Desfazer">
          ↶
        </button>

        <button id="redoBtn"
                class="toolButton"
                type="button"
                aria-label="Refazer">
          ↷
        </button>

        <button id="clearBtn"
                class="toolButton"
                type="button"
                aria-label="Limpar tudo">
          ⌫
        </button>

      </div>

      <!-- NOVO BOTÃO T -->
      <div id="textToolSlot">

        <button id="textToolButton"
                class="toolButton"
                type="button"
                aria-label="Texto">
          T
        </button>

      </div>

      <div id="right">

        <button id="flipBtn"
                class="toolButton"
                type="button"
                aria-label="Inverter câmera">
          ↔
        </button>

        <button id="settingsBtn"
                class="toolButton"
                type="button"
                aria-label="Ferramentas">
          ⚙
        </button>

        <button id="recordButton"
                type="button"
                aria-label="Gravar">
        </button>

      </div>

    </div>

    <div id="status">
      Pronto
    </div>

    <!-- MENU PRINCIPAL -->
    <div id="menuPanel">

      <button class="menuItem"
              id="menuCloseTools"
              type="button">
        Fechar
      </button>

      <button class="menuItem"
              data-menu-action="record"
              type="button">
        Gravação
      </button>

      <button class="menuItem"
              data-menu-action="camera"
              type="button">
        Reiniciar câmera
      </button>

    </div>

    <!-- PAINEL DE FERRAMENTAS -->
    <div id="toolsPanel">

      <div class="panelRow">

        <label for="colorInput">
          Cor
        </label>

        <input id="colorInput"
               type="color"
               value="#ffffff">

      </div>

      <div class="panelRow">

        <label for="widthInput">
          Espessura
        </label>

        <input id="widthInput"
               type="range"
               min="1"
               max="30"
               value="5">

      </div>

      <div class="panelRow">

        <button id="eraserBtn"
                class="menuItem"
                type="button">
          Borracha
        </button>

      </div>

      <div id="toolName">
        Caneta
      </div>

    </div>

    <!-- MENU COLAR -->
    <div id="canvasMenu">

      <button id="pasteButton"
              data-action="paste"
              type="button">
        Colar
      </button>

    </div>

    <!-- EDITOR DIRETO NA LOUSA -->
    <textarea id="inlineEditor"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="sentences"
              spellcheck="true"></textarea>

    <!-- CANCELAR IMAGEM -->
    <button id="imageCancelButton"
            type="button">
      Cancelar
    </button>

  </div>

  <!-- TELA INICIAL -->
  <div id="startOverlay">

    <div id="startCard">

      <img id="startLogo"
           src="./logo.png"
           alt="Lousa Cam">

      <h1>
        LOUSA CAM 2.0
      </h1>

      <button id="startButton"
              type="button">
        Iniciar câmera
      </button>

      <p id="permissionHint">
        Permita o acesso à câmera e ao microfone
        quando solicitado pelo navegador.
      </p>

    </div>

  </div>

</div>

<script src="./app.js?v=20260911-01"></script>

</body>
</html>
