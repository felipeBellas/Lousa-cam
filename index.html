<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lousa Cam PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    video.rear-camera {
      transform: scaleX(1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }
    .toolbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .btn {
      background: #2a2a2a;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { background: #444; }
    .btn.active { background: #007aff; }
    .color-picker { display: flex; gap: 6px; }
    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }
    input[type="range"] { width: 70px; }
  </style>
</head>
<body>
  <div id="app-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="toolbar">
      <button id="btn-flip" class="btn">🔄 Flip</button>

      <div class="color-picker">
        <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
        <div class="color-dot" style="background: #ff3b30;" data-color="#ff3b30"></div>
        <div class="color-dot" style="background: #ffcc00;" data-color="#ffcc00"></div>
        <div class="color-dot" style="background: #34c759;" data-color="#34c759"></div>
        <div class="color-dot" style="background: #007aff;" data-color="#007aff"></div>
        <div class="color-dot" style="background: #af52de;" data-color="#af52de"></div>
      </div>

      <button id="btn-eraser" class="btn">✏️ Borracha</button>
      <input type="range" id="lineWidth" min="2" max="30" value="5">

      <button id="btn-undo" class="btn">↩️</button>
      <button id="btn-redo" class="btn">↪️</button>
      <button id="btn-clear" class="btn">🗑️</button>

      <button id="btn-record" class="btn" style="background: #ff3b30;">🔴 Gravar</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
