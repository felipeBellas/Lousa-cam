<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stickers — Lousa Cam</title><link rel="stylesheet" href="stickers.css"></head>
<body><header><button id="back" type="button" aria-label="Voltar ao Estúdio Criativo">‹</button><div><h1>Stickers animados</h1><p>Configure antes de aplicar · FREE e PRO em teste</p></div></header>
<section class="settings"><label>Cor <input type="color" id="color" value="#ff5599"></label><label>Movimento <select id="motion"><option value="pulse">Pulsar</option><option value="float">Flutuar</option><option value="bounce">Pular</option><option value="swing">Balançar</option><option value="spin">Girar</option><option value="none">Parado</option></select></label><label>Velocidade <input type="range" id="speed" min="0.2" max="3" step="0.2" value="1"><output id="speedText">1×</output></label></section>
<p class="help">Escolha um Sticker e veja a prévia. Fixar bloqueia a posição, mas mantém a animação. Você poderá mover e girar com dois dedos como nas imagens.</p>
<main id="catalog"></main><p id="status" role="status"></p>
<script src="scenes-storage.js"></script><script src="stickers.js"></script></body></html>
