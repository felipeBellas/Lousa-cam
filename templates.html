<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F8F5">
  <title>Templates — Lousa Cam</title>
  <link rel="stylesheet" href="./templates.css">
</head>
<body>
  <main>
    <header>
      <a class="back" href="./index.html?camera=1">← Voltar à câmera</a>
      <h1>Templates</h1>
      <p>20 estilos para criar com personalidade.</p>
    </header>
    <section class="toolbar" aria-label="Personalização dos templates">
      <label for="orientation">Orientação
        <select id="orientation">
          <option value="9:16">Vertical · 9:16</option>
          <option value="16:9">Horizontal · 16:9</option>
        </select>
      </label>
      <label for="palette">Paleta do template
        <select id="palette">
          <option value="0">Pop</option>
          <option value="1">Sunset</option>
          <option value="2">Ocean</option>
          <option value="3">Candy</option>
          <option value="4">Classic</option>
        </select>
      </label>
      <label for="backgroundMode">Fundo das cenas
        <select id="backgroundMode">
          <option value="transparent">Transparente</option>
          <option value="solid">Cor sólida</option>
        </select>
      </label>
      <label for="backgroundColor" id="backgroundColorLabel" hidden>Cor do fundo
        <input id="backgroundColor" type="color" value="#191A29">
      </label>
      <label for="customColor">Cor principal
        <input id="customColor" type="color" value="#C6FF42">
      </label>
    </section>
    <p class="explain">O <strong>Bora Criar!</strong> continua gratuito. Os <strong>19 Templates PRO</strong> estão liberados somente para testes de desenvolvimento, com três cenas editáveis por modelo. O acesso comercial PRO dependerá da futura integração de assinaturas.</p>
    <p id="notice" hidden role="status"></p>
    <section class="models" id="models" aria-label="Biblioteca de 20 templates"></section>
  </main>
  <script>
  document.querySelector('a.back')?.addEventListener('click', event => {
    if (window.parent === window) return;
    event.preventDefault();
    window.parent.postMessage({type:'lousa-cam-templates-close'}, window.location.origin);
  });
</script>
<script src="./scenes-storage.js"></script>
  <script src="./templates.js"></script>
</body>
</html>
